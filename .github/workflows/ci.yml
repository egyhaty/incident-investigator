name: Verify fixture-backed investigator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py --output artifacts/demo-evaluation.json
      - run: docker build -t incident-investigator:0.1.0 .
      - uses: actions/upload-artifact@v4
        with:
          name: demo-evaluation-${{ matrix.python }}
          path: artifacts/demo-evaluation.json
