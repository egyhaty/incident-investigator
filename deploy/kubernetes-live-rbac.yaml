apiVersion: v1
kind: Namespace
metadata:
  name: incident-investigator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: investigator-reader
  namespace: incident-investigator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-investigator-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-investigator-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: incident-investigator-reader
subjects:
  - kind: ServiceAccount
    name: investigator-reader
    namespace: incident-investigator
